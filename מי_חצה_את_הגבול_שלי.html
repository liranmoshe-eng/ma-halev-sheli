<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מי חצה את הגבול שלי?</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --red: #ef4444;
    --green: #22c55e;
    --orange: #f97316;
    --purple: #8b5cf6;
    --pink: #ec4899;
    --teal: #14b8a6;
    --bg: #faf5ef;
    --card-bg: #ffffff;
    --text: #1e293b;
    --text-light: #64748b;
    --shadow: 0 4px 24px rgba(0,0,0,0.10);
    --shadow-lg: 0 8px 40px rgba(0,0,0,0.15);
    --radius: 16px;
  }

  body {
    font-family: 'Rubik', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    direction: rtl;
    overflow-x: hidden;
  }

  .screen { display: none; min-height: 100vh; padding: 20px; }
  .screen.active { display: flex; flex-direction: column; align-items: center; }

  /* ===== SPLASH SCREEN ===== */
  #splash-screen {
    justify-content: center;
    background: linear-gradient(135deg, #fef3c7 0%, #fde68a 30%, #fbbf24 100%);
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  #splash-screen::before {
    content: '';
    position: absolute;
    top: -50px; right: -50px;
    width: 200px; height: 200px;
    background: rgba(239,68,68,0.15);
    border-radius: 50%;
  }

  #splash-screen::after {
    content: '';
    position: absolute;
    bottom: -80px; left: -30px;
    width: 250px; height: 250px;
    background: rgba(37,99,235,0.1);
    border-radius: 50%;
  }

  .splash-content {
    position: relative;
    z-index: 2;
  }

  .splash-logo {
    width: 220px;
    height: 220px;
    margin: 0 auto 20px;
    background: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    overflow: hidden;
  }

  .splash-logo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .splash-logo .logo-placeholder {
    font-size: 5rem;
  }

  .splash-title {
    font-size: 2.8rem;
    font-weight: 900;
    color: #991b1b;
    margin-bottom: 8px;
    text-shadow: 2px 2px 0 rgba(255,255,255,0.5);
  }

  .splash-angry {
    font-size: 3rem;
    margin-bottom: 5px;
  }

  .splash-subtitle {
    font-size: 1.1rem;
    color: #92400e;
    margin-bottom: 35px;
    font-weight: 500;
  }

  .splash-btn {
    padding: 16px 50px;
    border: none;
    border-radius: 50px;
    font-size: 1.3rem;
    font-weight: 700;
    font-family: 'Rubik', sans-serif;
    cursor: pointer;
    background: linear-gradient(135deg, #dc2626, #ef4444);
    color: white;
    box-shadow: 0 6px 25px rgba(220,38,38,0.4);
    transition: all 0.3s;
  }

  .splash-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(220,38,38,0.5); }

  /* ===== INTRO SCREEN ===== */
  #intro-screen {
    justify-content: center;
    background: #faf5ef;
    text-align: center;
    padding: 20px;
  }

  .intro-image {
    width: 100%;
    max-width: 700px;
    border-radius: 20px;
    box-shadow: var(--shadow-lg);
    margin-bottom: 30px;
  }

  .intro-btn {
    padding: 16px 50px;
    border: none;
    border-radius: 50px;
    font-size: 1.2rem;
    font-weight: 700;
    font-family: 'Rubik', sans-serif;
    cursor: pointer;
    background: linear-gradient(135deg, var(--green), var(--teal));
    color: white;
    box-shadow: 0 6px 20px rgba(34,197,94,0.4);
    transition: all 0.3s;
  }

  .intro-btn:hover { transform: translateY(-3px); }

  /* ===== PLAYERS SCREEN ===== */
  #players-screen {
    padding-top: 40px;
    background: var(--bg);
  }

  .section-title {
    font-size: 1.8rem;
    font-weight: 700;
    text-align: center;
    margin-bottom: 8px;
  }

  .section-desc {
    text-align: center;
    color: var(--text-light);
    margin-bottom: 30px;
    font-size: 1rem;
  }

  .player-input-row {
    display: flex;
    gap: 10px;
    max-width: 400px;
    width: 100%;
    margin-bottom: 20px;
  }

  .player-input-row input {
    flex: 1;
    padding: 14px 18px;
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    font-size: 1.1rem;
    font-family: 'Rubik', sans-serif;
    outline: none;
    transition: border 0.2s;
    background: white;
  }

  .player-input-row input:focus { border-color: var(--primary); }

  .players-list {
    max-width: 400px;
    width: 100%;
    margin-bottom: 30px;
  }

  .player-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: white;
    padding: 8px 16px;
    border-radius: 20px;
    margin: 4px;
    font-size: 0.95rem;
    font-weight: 500;
  }

  .player-chip .remove {
    cursor: pointer;
    background: rgba(255,255,255,0.3);
    border: none;
    color: white;
    width: 22px; height: 22px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.8rem;
    transition: background 0.2s;
  }

  .player-chip .remove:hover { background: rgba(255,255,255,0.5); }

  /* ===== BUTTONS ===== */
  .btn {
    padding: 14px 36px;
    border: none;
    border-radius: 12px;
    font-size: 1.1rem;
    font-weight: 600;
    font-family: 'Rubik', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--primary), var(--purple));
    color: white;
    box-shadow: 0 4px 15px rgba(37,99,235,0.3);
  }

  .btn-primary:hover { transform: translateY(-2px); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .btn-green {
    background: linear-gradient(135deg, var(--green), var(--teal));
    color: white;
    box-shadow: 0 4px 15px rgba(34,197,94,0.3);
  }

  .btn-green:hover { transform: translateY(-2px); }

  .btn-orange {
    background: linear-gradient(135deg, var(--orange), var(--pink));
    color: white;
    box-shadow: 0 4px 15px rgba(249,115,22,0.3);
  }

  .btn-orange:hover { transform: translateY(-2px); }

  /* ===== GAME SCREEN ===== */
  #game-screen {
    padding-top: 20px;
    position: relative;
    background: var(--bg);
  }

  /* Floating decoration images */
  .float-img {
    position: fixed;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    opacity: 0.15;
    pointer-events: none;
    z-index: 0;
    object-fit: cover;
    border: 3px solid rgba(0,0,0,0.1);
  }

  .float-img:nth-child(1) { top: 10%; left: 2%; }
  .float-img:nth-child(2) { top: 30%; right: 2%; }
  .float-img:nth-child(3) { bottom: 25%; left: 3%; }
  .float-img:nth-child(4) { bottom: 10%; right: 3%; }

  .game-content {
    position: relative;
    z-index: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .game-header {
    width: 100%;
    max-width: 600px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .round-info {
    font-size: 1rem;
    font-weight: 600;
    color: var(--primary);
    background: white;
    padding: 8px 16px;
    border-radius: 20px;
    box-shadow: var(--shadow);
  }

  .category-badge {
    font-size: 0.9rem;
    font-weight: 500;
    padding: 8px 16px;
    border-radius: 20px;
    box-shadow: var(--shadow);
  }

  .progress-bar {
    width: 100%;
    max-width: 600px;
    height: 8px;
    background: #e2e8f0;
    border-radius: 4px;
    margin-bottom: 25px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--primary), var(--purple));
    border-radius: 4px;
    transition: width 0.5s ease;
  }

  .block-label {
    font-size: 1.3rem;
    font-weight: 700;
    color: #991b1b;
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .situation-card {
    width: 100%;
    max-width: 600px;
    background: white;
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    overflow: hidden;
    margin-bottom: 25px;
  }

  .situation-card-header {
    color: white;
    padding: 20px;
    text-align: center;
  }

  .situation-number {
    font-size: 0.9rem;
    opacity: 0.9;
    margin-bottom: 5px;
  }

  .situation-text {
    font-size: 1.3rem;
    font-weight: 700;
    line-height: 1.6;
  }

  .situation-card-body {
    padding: 20px;
  }

  .situation-card-body h3 {
    font-size: 1rem;
    color: var(--text-light);
    margin-bottom: 15px;
    text-align: center;
  }

  /* ===== PLAYER SELECT WITH INTENSITY ===== */
  .player-select-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
  }

  .player-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .player-name-btn {
    padding: 10px 18px;
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    cursor: pointer;
    font-size: 1rem;
    font-weight: 600;
    background: white;
    font-family: 'Rubik', sans-serif;
    transition: all 0.2s;
    min-width: 80px;
    text-align: center;
  }

  .player-name-btn:hover { border-color: var(--primary); background: #f8fafc; }
  .player-name-btn.selected { border-color: transparent; color: white; }

  .intensity-bar {
    display: none;
    gap: 4px;
    align-items: center;
  }

  .intensity-bar.visible { display: flex; }

  .intensity-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 2px solid #e2e8f0;
    background: white;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 700;
    font-family: 'Rubik', sans-serif;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #64748b;
  }

  .intensity-btn:hover { transform: scale(1.15); }

  .intensity-btn.i1 { border-color: #22c55e; }
  .intensity-btn.i1.active, .intensity-btn.i1:hover { background: #22c55e; color: white; border-color: #22c55e; }
  .intensity-btn.i2 { border-color: #84cc16; }
  .intensity-btn.i2.active, .intensity-btn.i2:hover { background: #84cc16; color: white; border-color: #84cc16; }
  .intensity-btn.i3 { border-color: #eab308; }
  .intensity-btn.i3.active, .intensity-btn.i3:hover { background: #eab308; color: white; border-color: #eab308; }
  .intensity-btn.i4 { border-color: #f97316; }
  .intensity-btn.i4.active, .intensity-btn.i4:hover { background: #f97316; color: white; border-color: #f97316; }
  .intensity-btn.i5 { border-color: #ef4444; }
  .intensity-btn.i5.active, .intensity-btn.i5:hover { background: #ef4444; color: white; border-color: #ef4444; }

  .selected-player-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-radius: 20px;
    color: white;
    font-size: 0.85rem;
    font-weight: 600;
    margin: 3px;
  }

  .selected-player-tag .tag-remove {
    cursor: pointer;
    background: rgba(255,255,255,0.3);
    border: none;
    color: white;
    width: 18px; height: 18px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.7rem;
  }

  .intensity-colors { }
  .ic1 { background: #22c55e; }
  .ic2 { background: #84cc16; }
  .ic3 { background: #eab308; }
  .ic4 { background: #f97316; }
  .ic5 { background: #ef4444; }

  .selected-tags-area {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 8px;
    min-height: 10px;
  }

  /* ===== FLIP CARD ===== */
  .flip-card-container {
    width: 100%;
    max-width: 600px;
    perspective: 1000px;
    margin-bottom: 25px;
  }

  .flip-card {
    width: 100%;
    min-height: 200px;
    position: relative;
    transition: transform 0.6s;
    transform-style: preserve-3d;
    cursor: pointer;
  }

  .flip-card.flipped { transform: rotateY(180deg); }

  .flip-card-front, .flip-card-back {
    width: 100%;
    min-height: 200px;
    backface-visibility: hidden;
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
  }

  .flip-card-front {
    position: absolute;
    top: 0;
    background: linear-gradient(135deg, #fef3c7, #fde68a);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px;
    gap: 15px;
  }

  .flip-card-front .card-icon { font-size: 4rem; }
  .flip-card-front .tap-hint { font-size: 1.1rem; font-weight: 600; color: #92400e; }
  .flip-card-front .tap-sub { font-size: 0.9rem; color: var(--text-light); }

  .flip-card-back {
    background: white;
    transform: rotateY(180deg);
    padding: 25px;
  }

  .flip-card-back h3 {
    text-align: center;
    color: #991b1b;
    font-size: 1.2rem;
    margin-bottom: 20px;
  }

  .option-card {
    background: #fefce8;
    border: 2px solid #fde68a;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 15px;
    transition: border-color 0.2s;
  }

  .option-card:hover { border-color: var(--orange); }

  .option-text {
    font-size: 1rem;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 10px;
  }

  .option-text::before { content: '\1F539'; margin-left: 6px; }

  .option-players {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .option-player-check { position: relative; }
  .option-player-check input { display: none; }

  .option-player-check label {
    display: block;
    padding: 6px 14px;
    border: 2px solid #e2e8f0;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 500;
    transition: all 0.2s;
    background: white;
  }

  .option-player-check input:checked + label {
    border-color: var(--green);
    background: #f0fdf4;
    color: #15803d;
  }

  .nav-buttons {
    display: flex;
    gap: 15px;
    margin-top: 10px;
    margin-bottom: 40px;
  }

  /* ===== SUMMARY ===== */
  #summary-screen { padding-top: 30px; padding-bottom: 60px; background: var(--bg); }

  .summary-title {
    font-size: 2rem;
    font-weight: 800;
    text-align: center;
    margin-bottom: 8px;
    color: #991b1b;
  }

  .summary-subtitle {
    text-align: center;
    color: var(--text-light);
    margin-bottom: 35px;
    font-size: 1rem;
  }

  .player-summary-card {
    width: 100%;
    max-width: 600px;
    background: white;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 20px;
    overflow: hidden;
  }

  .player-summary-header {
    padding: 18px 20px;
    color: white;
    font-size: 1.3rem;
    font-weight: 700;
  }

  .player-summary-body { padding: 20px; }

  .summary-situation {
    margin-bottom: 18px;
    padding-bottom: 18px;
    border-bottom: 1px solid #f1f5f9;
  }

  .summary-situation:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

  .summary-situation-title {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 8px;
  }

  .summary-intensity-badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 10px;
    color: white;
    font-size: 0.8rem;
    font-weight: 600;
    margin-right: 8px;
  }

  .summary-sentence {
    font-size: 0.9rem;
    color: var(--text-light);
    padding: 8px 12px;
    background: #fefce8;
    border-radius: 8px;
    margin-top: 4px;
    line-height: 1.6;
  }

  .no-data-msg {
    text-align: center;
    color: var(--text-light);
    padding: 20px;
    font-style: italic;
  }

  /* Category colors */
  .cat-football { background: linear-gradient(135deg, #22c55e, #16a34a); }
  .cat-friends { background: linear-gradient(135deg, #3b82f6, #2563eb); }
  .cat-school { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }
  .cat-home { background: linear-gradient(135deg, #f97316, #ea580c); }
  .cat-frustration { background: linear-gradient(135deg, #64748b, #475569); }
  .cat-siblings { background: linear-gradient(135deg, #ec4899, #db2777); }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .animate-in { animation: fadeIn 0.4s ease forwards; }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  .pulse { animation: pulse 2s infinite; }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-15px) rotate(5deg); }
  }

  .float-anim { animation: float 6s ease-in-out infinite; }
  .float-anim:nth-child(2) { animation-delay: 1.5s; }
  .float-anim:nth-child(3) { animation-delay: 3s; }
  .float-anim:nth-child(4) { animation-delay: 4.5s; }

  @media (max-width: 480px) {
    .splash-title { font-size: 2rem; }
    .splash-logo { width: 160px; height: 160px; }
    .situation-text { font-size: 1.1rem; }
    .btn { padding: 12px 24px; font-size: 1rem; }
    .screen { padding: 15px; }
    .float-img { width: 60px; height: 60px; }
  }
</style>
</head>
<body>

<!-- ===== SPLASH SCREEN ===== -->
<div id="splash-screen" class="screen active">
  <div class="splash-content animate-in">
    <div class="splash-angry">😠</div>
    <div class="splash-logo">
      <div class="logo-placeholder">🛡️😤</div>
    </div>
    <div class="splash-title">מי כועס כמוני?</div>
    <div class="splash-subtitle">משחק להכרת רגשות וגבולות אישיים</div>
    <button class="splash-btn" onclick="goToIntro()">🎮 בואו נתחיל!</button>
  </div>
</div>

<!-- ===== INTRO SCREEN ===== -->
<div id="intro-screen" class="screen">
  <div class="animate-in" style="width:100%; display:flex; flex-direction:column; align-items:center;">

const intensityLabels=["","קצת מכעיס","","מכעיס","","מאוד מכעיס"];
const intensityEmojis=["","🟢","🟢","🟡","🟠","🔴"];

let players=[];
let gameRounds=[];
let currentRound=0;
// block1Data[round] = { playerName: intensity(1-5) }
let block1Data=[];
// block2Data[round][optionIndex] = [playerName, ...]
let block2Data=[];

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

function goToIntro(){ showScreen('intro-screen'); }
function goToPlayers(){
  showScreen('players-screen');
  document.getElementById('player-name-input').focus();
}

function addPlayer(){
  const input=document.getElementById('player-name-input');
  const name=input.value.trim();
  if(!name||players.includes(name)){input.value='';return;}
  players.push(name);
  input.value='';
  renderPlayers();
  input.focus();
}

function removePlayer(name){
  players=players.filter(p=>p!==name);
  renderPlayers();
}

function renderPlayers(){
  const list=document.getElementById('players-list');
  list.innerHTML=players.map((p,i)=>
    '<span class="player-chip" style="background:'+playerColors[i%playerColors.length]+'">'+p+
    '<button class="remove" onclick="removePlayer(\''+p+'\')">&times;</button></span>'
  ).join('');
  document.getElementById('start-game-btn').disabled=players.length<1;
}

function startGame(){
  const shuffled=[...allSituations].sort(()=>Math.random()-0.5);
  gameRounds=shuffled.slice(0,10);
  currentRound=0;
  block1Data=gameRounds.map(()=>({}));
  block2Data=gameRounds.map(s=>s.options.map(()=>[]));
  showScreen('game-screen');
  renderRound();
}

function renderRound(){
  const sit=gameRounds[currentRound];
  document.getElementById('round-info').textContent='קלף '+(currentRound+1)+' מתוך 10';
  const badge=document.getElementById('category-badge');
  badge.textContent=sit.catLabel;
  badge.className='category-badge '+categoryColors[sit.category];
  badge.style.color='white';
  document.getElementById('progress-fill').style.width=(currentRound/10*100)+'%';
  document.getElementById('situation-number').textContent='מצב מספר '+sit.id;
  document.getElementById('situation-text').textContent=sit.text;
  document.getElementById('situation-header').style.background='linear-gradient(135deg, '+categoryBgColors[sit.category]+', '+categoryBgColors[sit.category]+'dd)';

  // Block 1 players with intensity
  let ph='';
  players.forEach((p,i)=>{
    const hasIntensity=block1Data[currentRound][p];
    ph+='<div class="player-row" id="prow_'+currentRound+'_'+i+'">';
    ph+='<button class="player-name-btn'+(hasIntensity?' selected':'')+'" ';
    if(hasIntensity) ph+='style="background:'+intensityColors[hasIntensity]+'" ';
    ph+='onclick="togglePlayerSelect('+i+',\''+p+'\')">'+p+'</button>';
    ph+='<div class="intensity-bar'+(hasIntensity&&!block1Data[currentRound][p]?' visible':'')+'" id="ibar_'+currentRound+'_'+i+'">';
    for(let lv=1;lv<=5;lv++){
      ph+='<button class="intensity-btn i'+lv+(hasIntensity===lv?' active':'')+'" onclick="setIntensity('+i+',\''+p+'\','+lv+')" title="'+(intensityLabels[lv]||lv)+'">'+lv+'</button>';
    }
    ph+='</div></div>';
  });
  document.getElementById('block1-players').innerHTML=ph;
  renderBlock1Tags();

  // Flip card reset
  document.getElementById('flip-card').classList.remove('flipped');

  // Block 2 options
  let oh='';
  sit.options.forEach((opt,oi)=>{
    oh+='<div class="option-card"><div class="option-text">'+opt+'</div><div class="option-players">';
    players.forEach((p,pi)=>{
      const chk=block2Data[currentRound][oi].includes(p)?' checked':'';
      oh+='<div class="option-player-check"><input type="checkbox" id="b2_'+currentRound+'_'+oi+'_'+pi+'"'+chk+' onchange="toggleBlock2Player('+oi+',\''+p+'\')"><label for="b2_'+currentRound+'_'+oi+'_'+pi+'">'+p+'</label></div>';
    });
    oh+='</div></div>';
  });
  document.getElementById('options-container').innerHTML=oh;
  document.getElementById('next-btn').textContent=currentRound<9?'הקלף הבא ➡️':'🛡️ לסיכום!';
  window.scrollTo(0,0);
}

function togglePlayerSelect(idx,name){
  if(block1Data[currentRound][name]){
    // Remove
    delete block1Data[currentRound][name];
    renderRound();
  } else {
    // Show intensity bar
    const bar=document.getElementById('ibar_'+currentRound+'_'+idx);
    if(bar) bar.classList.add('visible');
  }
}

function setIntensity(idx,name,level){
  block1Data[currentRound][name]=level;
  renderRound();
}

function renderBlock1Tags(){
  const tags=document.getElementById('block1-tags');
  const data=block1Data[currentRound];
  let html='';
  Object.keys(data).forEach(name=>{
    const lv=data[name];
    html+='<span class="selected-player-tag ic'+lv+'">'+intensityEmojis[lv]+' '+name+' ('+lv+') <button class="tag-remove" onclick="removeBlock1(\''+name+'\')">&times;</button></span>';
  });
  tags.innerHTML=html;
}

function removeBlock1(name){
  delete block1Data[currentRound][name];
  renderRound();
}

function flipCard(){
  document.getElementById('flip-card').classList.toggle('flipped');
}

function toggleBlock2Player(oi,name){
  const arr=block2Data[currentRound][oi];
  const idx=arr.indexOf(name);
  if(idx>=0) arr.splice(idx,1); else arr.push(name);
}

function nextRound(){
  if(currentRound<9){currentRound++;renderRound();}
  else showSummary();
}

function showSummary(){
  showScreen('summary-screen');
  const container=document.getElementById('summary-container');
  const ps={};
  players.forEach(p=>{ps[p]=[];});

  gameRounds.forEach((sit,ri)=>{
    // Add intensity info
    Object.keys(block1Data[ri]).forEach(pn=>{
      if(!ps[pn]) return;
      const intensity=block1Data[ri][pn];
      // Check block2 selections
      sit.options.forEach((opt,oi)=>{
        if(block2Data[ri][oi].includes(pn)){
          ps[pn].push({text:sit.text,cat:sit.catLabel,summary:sit.summaries[oi],intensity:intensity});
        }
      });
      // If no block2 selection but was in block1
      const hasBlock2=sit.options.some((o,oi)=>block2Data[ri][oi].includes(pn));
      if(!hasBlock2){
        ps[pn].push({text:sit.text,cat:sit.catLabel,summary:null,intensity:intensity});
      }
    });

    // Also check block2 without block1
    sit.options.forEach((opt,oi)=>{
      block2Data[ri][oi].forEach(pn=>{
        if(!block1Data[ri][pn] && ps[pn]){
          ps[pn].push({text:sit.text,cat:sit.catLabel,summary:sit.summaries[oi],intensity:null});
        }
      });
    });
  });

  let html='';
  players.forEach((p,pi)=>{
    const items=ps[p];
    html+='<div class="player-summary-card animate-in"><div class="player-summary-header" style="background:'+playerColors[pi%playerColors.length]+'">👤 '+p+'</div><div class="player-summary-body">';
    if(!items.length){
      html+='<div class="no-data-msg">לא נבחרו אפשרויות עבור '+p+'</div>';
    } else {
      items.forEach(it=>{
        html+='<div class="summary-situation"><div class="summary-situation-title">'+it.cat+' – '+it.text;
        if(it.intensity) html+=' <span class="summary-intensity-badge ic'+it.intensity+'">'+intensityEmojis[it.intensity]+' '+it.intensity+'/5</span>';
        html+='</div>';
        if(it.summary) html+='<div class="summary-sentence">🛡️ '+p+' – '+it.summary+'</div>';
        html+='</div>';
      });
    }
    html+='</div></div>';
  });
  container.innerHTML=html;
}

function restartGame(){
  players=[];
  gameRounds=[];
  currentRound=0;
  block1Data=[];
  block2Data=[];
  showScreen('splash-screen');
}
</script>
</body>
</html>
